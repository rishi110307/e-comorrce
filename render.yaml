databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce_user

services:
  - type: web
    name: ecommerce-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: FRONTEND_ORIGIN
        value: "*"
  - type: web
    name: ecommerce-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://ecommerce-api.onrender.com/api
